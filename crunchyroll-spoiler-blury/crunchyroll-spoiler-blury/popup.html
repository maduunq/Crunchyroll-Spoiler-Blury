<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 260px; margin: 0; padding: 14px; font: 14px Arial, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #999; border-radius: 24px; cursor: pointer; transition: background .15s; }
    .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s; }
    input:checked + .slider { background: #f47521; }
    input:checked + .slider::before { transform: translateX(20px); }
  </style>
</head>
<body>
  <h1>Crunchyroll Spoiler Blury</h1>
  <div class="row">
    <span id="status">Protection enabled</span>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
